<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#f5e6dc" />
  <title>When you need a reminder</title>
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" type="image/png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf5f0;
      --card: #fffbf7;
      --accent: #c97b63;
      --accent-soft: #e8c4b8;
      --text: #3d3232;
      --text-soft: #6b5b5b;
      --shadow: rgba(201, 123, 99, 0.15);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1614;
        --card: #252019;
        --accent: #d4937a;
        --accent-soft: #4a3a32;
        --text: #e8e0da;
        --text-soft: #a8988f;
        --shadow: rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      min-height: -webkit-fill-available;
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .intro {
      margin-bottom: 1.25rem;
    }

    .intro h1 {
      font-weight: 300;
      font-size: 1.5rem;
      color: var(--text-soft);
      margin-bottom: 0.5rem;
    }

    .intro p {
      font-size: 0.95rem;
      color: var(--text-soft);
      opacity: 0.9;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .cat-btn {
      appearance: none;
      border: 1px solid var(--accent-soft);
      background: var(--card);
      color: var(--text-soft);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.45rem 0.85rem;
      border-radius: 1.5rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      -webkit-appearance: none;
    }

    .cat-btn:hover, .cat-btn:active {
      background: var(--accent-soft);
      color: var(--text);
    }

    .cat-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .cta {
      appearance: none;
      border: none;
      background: linear-gradient(135deg, var(--accent) 0%, #b86a52 100%);
      color: #fff;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 1rem 2rem;
      border-radius: 2rem;
      cursor: pointer;
      box-shadow: 0 8px 24px var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    .cta:hover, .cta:active {
      transform: scale(1.02);
      box-shadow: 0 10px 28px var(--shadow);
    }

    .card-wrap {
      width: 100%;
      max-width: 360px;
      margin-top: 2rem;
    }

    .reminder-card {
      display: none;
      background: var(--card);
      border-radius: 1.25rem;
      padding: 1.75rem;
      box-shadow: 0 12px 40px var(--shadow);
      border: 1px solid var(--accent-soft);
      text-align: left;
      animation: fadeIn 0.4s ease;
    }

    .reminder-card.visible {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reminder-card .quote {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-style: italic;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .reminder-card .hint {
      font-size: 0.8rem;
      color: var(--text-soft);
      opacity: 0.8;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-top: 1rem;
    }

    .another {
      background: transparent;
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 0;
    }

    .another:hover {
      opacity: 0.85;
    }

    .copy-share {
      display: flex;
      gap: 0.5rem;
    }

    .copy-share button {
      background: var(--bg);
      border: 1px solid var(--accent-soft);
      color: var(--text-soft);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.4rem 0.75rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .copy-share button:hover {
      background: var(--accent-soft);
      color: var(--text);
    }

    .home-link {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--text-soft);
    }

    .home-link button {
      background: none;
      border: none;
      color: var(--accent);
      font-family: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div id="home">
      <div class="intro">
        <h1>Hi, my princess.</h1>
        <p>Whenever you need a little reminder of the good stuff.</p>
      </div>
      <div class="categories" id="categories"></div>
      <button type="button" class="cta" id="needReminder">I need a reminder</button>
    </div>

    <div class="card-wrap">
      <div class="reminder-card" id="reminderCard" aria-live="polite">
        <p class="quote" id="quoteText"></p>
        <p class="hint">Something I wanted you to remember.</p>
        <div class="card-actions">
          <button type="button" class="another" id="anotherBtn">Another one</button>
          <div class="copy-share">
            <button type="button" id="copyBtn">Copy</button>
            <button type="button" id="shareBtn">Share</button>
          </div>
        </div>
      </div>
    </div>

    <div class="home-link" id="backWrap" style="display: none;">
      <button type="button" id="backBtn">← Back</button>
    </div>
  </div>

  <script>
    // Reminders: { text, tags }. Tags: "any" (always), "sweet", "comfort", "smile". Add your own and tag them.
    const reminders = [
      { text: "You're the best thing that's happened to me.", tags: ["any", "sweet"] },
      { text: "You are the wind to my sails.", tags: ["any", "sweet"] },
      { text: "Take a second to yourself.", tags: ["any", "comfort"] },
      { text: "You have accomplished so much by yourself, don't let anyone take that away from you.", tags: ["any", "comfort"] },
      { text: "Think about Isabella's in Menorca, and look forward to that moment each summer.", tags: ["any", "smile"] },
      { text: "One day we will look back at today, and smile at how much we've grown since.", tags: ["any", "comfort"] },
      { text: "Sometimes plans don't go as planned, it's OK! Just breathe, adapt, and remember to enjoy the moment.", tags: ["any", "comfort"] },
      { text: "I'm so proud of you, always.", tags: ["any", "sweet"] },
      { text: "You're stronger than you think.", tags: ["any", "comfort"] },
      { text: "I love you exactly as you are.", tags: ["any", "sweet"] },
      { text: "You make my days brighter.", tags: ["any", "sweet"] },
      { text: "I'm here for you, no matter what.", tags: ["any", "comfort"] },
      { text: "You deserve all the good things.", tags: ["any", "sweet"] },
      { text: "I believe in you.", tags: ["any", "comfort"] },
      { text: "I'm lucky to have you in my life.", tags: ["any", "sweet"] },
      { text: "You're beautiful inside and out.", tags: ["any", "sweet"] },
      { text: "Take your time. Everyone has their own path.", tags: ["any", "comfort"] },
      { text: "You're doing great, even when it doesn't feel like it.", tags: ["any", "comfort"] },
      { text: "I chose you, and I'd choose you again.", tags: ["any", "sweet"] },
      { text: "You matter so much to me.", tags: ["any", "sweet"] }
    ];

    const CATEGORIES = [
      { id: "any", label: "Any" },
      { id: "sweet", label: "Something sweet" },
      { id: "comfort", label: "Comfort" },
      { id: "smile", label: "To make me smile" }
    ];

    let deck = [];
    let currentCategory = "any";

    function getListForCategory(cat) {
      if (cat === "any") return reminders.map(r => r.text);
      return reminders.filter(r => r.tags && r.tags.includes(cat)).map(r => r.text);
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildDeck() {
      let list = getListForCategory(currentCategory);
      if (list.length === 0) list = getListForCategory("any");
      deck = shuffle(list);
    }

    function getNextReminder() {
      if (deck.length === 0) buildDeck();
      return deck.pop() || getListForCategory("any")[0] || "You're loved.";
    }

    // DOM
    const card = document.getElementById('reminderCard');
    const quoteText = document.getElementById('quoteText');
    const needReminder = document.getElementById('needReminder');
    const anotherBtn = document.getElementById('anotherBtn');
    const backWrap = document.getElementById('backWrap');
    const backBtn = document.getElementById('backBtn');
    const categoriesEl = document.getElementById('categories');
    const copyBtn = document.getElementById('copyBtn');
    const shareBtn = document.getElementById('shareBtn');

    function renderCategories() {
      categoriesEl.innerHTML = CATEGORIES.map(c => {
        const active = currentCategory === c.id ? ' active' : '';
        return `<button type="button" class="cat-btn${active}" data-cat="${c.id}">${c.label}</button>`;
      }).join('');
      categoriesEl.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCategory = btn.dataset.cat;
          categoriesEl.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          buildDeck();
        });
      });
    }

    function showReminder() {
      const quote = getNextReminder();
      quoteText.textContent = quote;
      card.classList.add('visible');
      backWrap.style.display = 'block';
    }

    function hideReminder() {
      card.classList.remove('visible');
      backWrap.style.display = 'none';
    }

    needReminder.addEventListener('click', showReminder);
    anotherBtn.addEventListener('click', showReminder);
    backBtn.addEventListener('click', hideReminder);

    copyBtn.addEventListener('click', () => {
      const q = quoteText.textContent;
      if (q && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(q);
      }
    });

    shareBtn.addEventListener('click', () => {
      const q = quoteText.textContent;
      if (q && navigator.share) {
        navigator.share({ title: 'A reminder', text: q });
      } else if (q && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(q);
      }
    });

    buildDeck();
    renderCategories();
  </script>
</body>
</html>
