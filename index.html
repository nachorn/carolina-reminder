<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#f5e6dc" />
  <title>When you need a reminder</title>
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf5f0;
      --card: #fffbf7;
      --accent: #c97b63;
      --accent-soft: #e8c4b8;
      --text: #3d3232;
      --text-soft: #6b5b5b;
      --shadow: rgba(201, 123, 99, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      min-height: -webkit-fill-available;
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .intro {
      margin-bottom: 2rem;
    }

    .intro h1 {
      font-weight: 300;
      font-size: 1.5rem;
      color: var(--text-soft);
      margin-bottom: 0.5rem;
    }

    .intro p {
      font-size: 0.95rem;
      color: var(--text-soft);
      opacity: 0.9;
    }

    .cta {
      appearance: none;
      border: none;
      background: linear-gradient(135deg, var(--accent) 0%, #b86a52 100%);
      color: #fff;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 1rem 2rem;
      border-radius: 2rem;
      cursor: pointer;
      box-shadow: 0 8px 24px var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    .cta:hover, .cta:active {
      transform: scale(1.02);
      box-shadow: 0 10px 28px var(--shadow);
    }

    .card-wrap {
      width: 100%;
      max-width: 360px;
      margin-top: 2rem;
    }

    .reminder-card {
      display: none;
      background: var(--card);
      border-radius: 1.25rem;
      padding: 1.75rem;
      box-shadow: 0 12px 40px var(--shadow);
      border: 1px solid var(--accent-soft);
      text-align: left;
      animation: fadeIn 0.4s ease;
    }

    .reminder-card.visible {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reminder-card .quote {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-style: italic;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .reminder-card .hint {
      font-size: 0.8rem;
      color: var(--text-soft);
      opacity: 0.8;
    }

    .another {
      margin-top: 1.25rem;
      background: transparent;
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .another:hover {
      opacity: 0.85;
    }

    .home-link {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--text-soft);
    }

    .home-link button {
      background: none;
      border: none;
      color: var(--accent);
      font-family: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div id="home">
      <div class="intro">
        <h1>Hi, my princess.</h1>
        <p>Whenever you need a little reminder of the good stuff.</p>
      </div>
      <button type="button" class="cta" id="needReminder">I need a reminder</button>
    </div>

    <div class="card-wrap">
      <div class="reminder-card" id="reminderCard" aria-live="polite">
        <p class="quote" id="quoteText"></p>
        <p class="hint">Something I wanted you to remember.</p>
        <button type="button" class="another" id="anotherBtn">Another one</button>
      </div>
    </div>

    <div class="home-link" id="backWrap" style="display: none;">
      <button type="button" id="backBtn">← Back</button>
    </div>
  </div>

  <script>
    // Edit these! Add things you've said, inside jokes, or anything that reminds her she's loved.
    const reminders = [
      "You're the best thing that's happened to me.",
      "You are the wind to my sails.",
      "Take a second to yourself.",
      "You have accomplished so much by yourself, don't let anyone take that away from you.",
      "Think about Isabella's in Menorca, and look forward to that moment each summer.",
      "One day we will look back at today, and smile at how much we've grown since.",
      "Sometimes plans don't go as planned, it's OK! Just breathe, adapt, and remember to enjoy the moment.",
   
      "I'm so proud of you, always.",
      "You're stronger than you think.",
      "I love you exactly as you are.",
      "You make my days brighter.",
      "I'm here for you, no matter what.",
      "You deserve all the good things.",
      "I believe in you.",
      "I'm lucky to have you in my life.",
      "You're beautiful inside and out.",
      "Take your time. Everyone has their own path.",
      "You're doing great, even when it doesn't feel like it.",
      "I chose you, and I'd choose you again.",
      "You matter so much to me."
    ];

    const card = document.getElementById('reminderCard');
    const quoteText = document.getElementById('quoteText');
    const needReminder = document.getElementById('needReminder');
    const anotherBtn = document.getElementById('anotherBtn');
    const backWrap = document.getElementById('backWrap');
    const backBtn = document.getElementById('backBtn');

    let lastIndex = -1;

    function pickRandom() {
      let i;
      do {
        i = Math.floor(Math.random() * reminders.length);
      } while (reminders.length > 1 && i === lastIndex);
      lastIndex = i;
      return reminders[i];
    }

    function showReminder() {
      quoteText.textContent = pickRandom();
      card.classList.add('visible');
      backWrap.style.display = 'block';
    }

    function hideReminder() {
      card.classList.remove('visible');
      backWrap.style.display = 'none';
    }

    needReminder.addEventListener('click', showReminder);
    anotherBtn.addEventListener('click', showReminder);
    backBtn.addEventListener('click', hideReminder);
  </script>
</body>
</html>
